
# ============================================================
# BERT-base — GLUE (6-task benchmark)
# Seesaw-v1: fixed-formula, query-projection only
# ============================================================

model: 
  name: bert-base-uncased
  target_modules: [query]        # Seesaw-v1: query projections only
  num_labels: 2                  # overridden per-task (e.g. 4 for AG News, 1 for STS-B regression)

data:
  tasks: [ag_news, sst2, qnli, mrpc, rte, stsb]
  max_length: 128
  train_batch_size: 32
  eval_batch_size: 32

training:
  num_epochs: 25
  lora_lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  seed: 42
  num_seeds: 5                   # Table 1 results averaged over 5 seeds

lora:
  alpha: 32
  target_total_rank: 96
  min_rank: 2
  max_rank: 16

controller:
  enabled: true
  start_epoch: 2
  interval: 2
  ema_decay: null                # Seesaw-v1 uses epoch-averaged scores, not EMA
  aggregation: epoch_average      # "epoch_average" (v1) vs "ema" (v2)
  normalization: none             # Seesaw-v1 compares raw epoch-averaged scores
  importance_gap: 0.10            # relative gap: (s_r - s_d) / (s_r + eps)

evaluation:
  metrics: [accuracy, precision, recall, f1]
  metrics_stsb: [pearson, spearman]   # STS-B is a regression task

checkpoint:
  best_path: results/checkpoints/bert_base_{task}_best.pt
  final_path: results/checkpoints/bert_base_{task}_final.pt
  transfer_log: results/logs/transfers_bert_base_{task}.txt
