# ============================================================
# DeBERTa-v3-base — CoLA
# Seesaw-v2: generalized adaptive Q/K/V/O LoRA
# Also used for: SST-2, STS-B, MRPC (Table 3 comparison)
# ============================================================

model:
  name: microsoft/deberta-v3-base
  target_modules: [query_proj, key_proj, value_proj, output.dense]  # Q/K/V/O, M=48 modules
  num_labels: 2

data:
  task: cola
  metric: matthews_correlation
  max_length: 128
  train_batch_size: 32
  eval_batch_size: 32

training:
  num_epochs: 25
  lora_lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  seed: 42
  num_seeds: 3                   # 3-seed reporting used for optimizer-reset ablation

lora:
  alpha: 32
  target_total_rank: 827
  min_rank: 2
  max_rank: 64

controller:
  enabled: true
  start_epoch: 2
  interval: 1                    # every-epoch checkpointing (see interval ablation)
  ema_decay: 0.85
  aggregation: ema
  normalization: zscore          # options: none | mean | zscore
  importance_gap: 0.25           # 0.0005 for none, 0.10 for mean, 0.25 for zscore

optimizer_reset:
  policy: global                 # options: global | selective
  # global: rebuild optimizer over all LoRA params after every transfer
  # selective: reset state only for the transferred donor/receiver modules

baselines:
  - bitfit
  - houlsby_adapters
  - pfeiffer_adapters
  - lora
  - adalora

evaluation:
  metrics: [mcc, accuracy]

checkpoint:
  best_path: results/checkpoints/deberta_v3_cola_{normalization}_best.pt
  final_path: results/checkpoints/deberta_v3_cola_{normalization}_final.pt
  transfer_log: results/logs/transfers_deberta_v3_cola_{normalization}.txt
