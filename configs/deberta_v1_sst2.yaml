# ============================================================
# DeBERTa-v1-base — SST-2
# Efficiency profiling: Full FT, LoRA, LoRA-FA, (IA)^3, Seesaw
# ============================================================

model:
  name: microsoft/deberta-base
  target_modules: [query, key, value, output]
  num_labels: 2

data:
  task: sst2
  max_length: 128
  train_batch_size: 32
  eval_batch_size: 32

training:
  num_epochs: 25
  lora_lr: 1.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.06
  grad_clip: 1.0
  seed: 42
  num_seeds: 1                   # Table 2 is single-run, controlled efficiency comparison
  hardware: tesla_t4
  precision: fp32

lora:
  alpha: 32
  target_total_rank: null        # set to match standard LoRA's rank for fair comparison
  min_rank: 2
  max_rank: 64

baselines:
  - full_finetuning
  - lora
  - lora_fa                      # freezes A, trains only B
  - ia3                          # rescales activations, no low-rank update

controller:
  enabled: true                  # only for the Seesaw row; disabled for LoRA/LoRA-FA/(IA)^3/Full-FT
  start_epoch: 2
  interval: 2
  ema_decay: 0.85
  aggregation: ema
  normalization: zscore
  importance_gap: 0.25

evaluation:
  metrics: [accuracy]
  report: [trainable_params, train_loss, val_loss, accuracy]

checkpoint:
  best_path: results/checkpoints/deberta_v1_sst2_{method}_best.pt
  final_path: results/checkpoints/deberta_v1_sst2_{method}_final.pt
  transfer_log: results/logs/transfers_deberta_v1_sst2_{method}.txt
