model:
  name: microsoft/deberta-v3-base
  rank: 8
  alpha: 32.0
  train_classifier: true

# Shared defaults. Task-specific values below override these.
training:
  batch_size: 32
  eval_batch_size: 32
  learning_rate: 0.0005
  classifier_learning_rate: 0.0005
  epochs: 4
  max_length: 128
  weight_decay: 0.01
  warmup_ratio: 0.10
  max_grad_norm: 1.0

alora:
  min_rank: 2
  max_rank: 16
  global_rank_budget: 192
  ema_beta: 0.85
  controller_start_epoch: 2
  controller_interval: 2
  gap_threshold: 0.25
  max_rank_move: 1

# Exact task-level entries live here so the GitHub artifact is
# self-contained. Values not overridden here inherit training defaults.
tasks:
  qqp:
    num_labels: 5

  qnli:
    num_labels: 5

  sst2:
    num_labels: 5

  stsb:
    num_labels: 25
